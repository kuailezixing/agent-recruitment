<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的 Agent</title>
    <link rel="icon" href="/static/favicon.ico">
    <button id="newChat" style="padding:8px 16px; background:#f0f0f0; border:1px solid #ddd; border-radius:6px; cursor:pointer;">新会话</button>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        #chat { border: 1px solid #ddd; height: 400px; overflow-y: auto; padding: 12px; border-radius: 8px; }
        .user { color: #0066cc; margin: 8px 0; }
        .ai { color: #333; margin: 8px 0; }
        #input-area { display: flex; margin-top: 12px; gap: 8px; }
        #input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        #send { padding: 10px 24px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .ai {
            color: #333;
            margin: 12px 0;
            line-height: 1.6;
        }

        /* Markdown 渲染样式 */
        .ai p {
            margin: 6px 0;
        }
        .ai strong {
            color: #1a1a1a;
            font-weight: 600;
        }
        .ai ul, .ai ol {
            padding-left: 24px;
            margin: 8px 0;
        }
        .ai li {
            margin: 4px 0;
            line-height: 1.6;
        }
        .ai h1, .ai h2, .ai h3 {
            margin: 12px 0 6px 0;
            font-size: 1.05em;
        }
        .ai code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: Consolas, monospace;
            font-size: 0.9em;
        }
        .ai pre {
            background: #f6f8fa;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .time {
            display: block;
            color: #999;
            font-size: 11px;
            margin-top: 4px;
            text-align: right;
        }
    </style>
</head>
<body>
    <h2>🤖 我的 Agent</h2>
    <div id="chat"></div>
    <div id="input-area">
        <input id="input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button id="send" onclick="sendMsg()">发送</button>
    </div>
    <script>
        function formatTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }
        function generateSessionId() {
            return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 10);
            }
        
        let sessionId = localStorage.getItem('session_id');
        if (!sessionId) {
            sessionId = generateSessionId();
            localStorage.setItem('session_id', sessionId);
        }
        console.log('当前 session_id:', sessionId);

        async function sendMsg() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;
            const chat = document.getElementById('chat');
            // 记录开始时间
            const startTime = Date.now();
            const sentTime = formatTime();
            chat.innerHTML += `<div class="user">你：${msg}<span class="time">${formatTime()}</span></div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: msg, session_id: sessionId })
                });
                const data = await res.json();
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);   // 耗时（秒）
                const htmlContent = marked.parse(data.answer);
                chat.innerHTML += `<div class="ai"><strong>AI：</strong>${htmlContent}<span class="time">${formatTime()} · 耗时 ${elapsed}s</span></div>`;
            } catch (e) {
                chat.innerHTML += `<div class="ai" style="color:red">网络错误：${e.message}<span class="time">${formatTime()}</span></div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
        function newConversation() {
            // 1. 生成新 session_id
        sessionId = generateSessionId();
        localStorage.setItem('session_id', sessionId);
        console.log('新会话已创建:', sessionId);

        // 2. 清空界面
        document.getElementById('chat').innerHTML = '';

        // 3. 提示用户
        document.getElementById('chat').innerHTML =
            '<div style="color:#888; text-align:center; margin-top:20px;">新对话已开始</div>';
        }

// 绑定按钮事件
document.getElementById('newChat').addEventListener('click', newConversation);
    </script>
</body>
</html>
